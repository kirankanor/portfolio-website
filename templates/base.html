<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- the title block below lets a future page override the tab title; we only have one page for now -->
    <title>{% block title %}{{ profile.name }} - Portfolio{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar">
        <span class="logo">{{ profile.name }}</span>
        <div class="nav-links">
            <a href="#about">About</a>
            <a href="#skills">Skills</a>
            <a href="#projects">Projects</a>
            <a href="#contact">Contact</a>
        </div>
    </nav>

    <!-- the content block below is where index.html injects the page-specific sections -->
    {% block content %}{% endblock %}

    <footer>
        <p>&copy; 2026 {{ profile.name }}. Built with Python + Flask.</p>
    </footer>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    <script src="{{ url_for('static', filename='js/dot-text.js') }}"></script>
</body>
</html>
